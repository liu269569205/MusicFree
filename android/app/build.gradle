def appVersion = getVersion()
def appVersionCode = 400011


android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "fun.upup.musicfree"

    defaultConfig {
        applicationId "fun.upup.musicfree"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // !! Add lines
         release {
            storeFile file(keystoreProperties['RELEASE_STORE_FILE'])
            storePassword keystoreProperties['RELEASE_STORE_PASSWORD']
            keyAlias keystoreProperties['RELEASE_KEY_ALIAS']
            keyPassword keystoreProperties['RELEASE_KEY_PASSWORD']
        }
    }
    splits {
            abi {
                reset()
                enable true
                universalApk true
                // 按构建类型自动选 ABI，不用再手动改：
                // - debug（含 installDebug / assembleDebug）：只编 arm64-v8a，测试机都是 arm64，构建快
                // - release（正式包）：**不指定 ABI 过滤**，只出一个全 ABI 的
                //   app-universal-release.apk，不再额外打 4 个分 ABI 包
                //   （分 ABI 打包本身不省事，还容易撞 packageRelease 的 IncrementalSplitterRunnable 报错）
                def taskNames = gradle.startParameter.taskNames.collect { it.toLowerCase() }
                def buildingDebug = taskNames.any { it.contains('debug') } &&
                        !taskNames.any { it.contains('release') }
                if (buildingDebug) {
                    include "arm64-v8a"
                }
            }
    }



    buildTypes {
        debug {
            // 调试阶段与正式包使用同一个 keystore：
            // 这样 debug 包可以直接覆盖安装到已装好的 release 包上，App 数据（歌单/配置/插件）不会丢。
            // 正式包仍然走 release 签名，两者签名一致，互装不冲突。
            signingConfig signingConfigs.release
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// 正式包只出一个全 ABI 的 APK，名字固定成 app-universal-release.apk
// （splits 已关掉分 ABI 输出，这里只是把默认的 app-release.apk 改名）
androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("app-universal-release.apk")
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // !! Add lines
    implementation project(':react-native-fs')
    implementation 'com.facebook.fresco:animated-gif:2.5.0'
    // https://mvnrepository.com/artifact/net.jthink/jaudiotagger
    implementation 'net.jthink:jaudiotagger:2.2.5'
    implementation 'androidx.core:core-splashscreen:1.0.0'
}

